<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Video Gateway</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Video Gateway</h1>
        <p>iPad 端统一调用本地与第三方视频模型</p>
      </header>

      <section class="card">
        <h2>生成任务</h2>
        <form id="generate-form">
          <label for="provider">Provider</label>
          <select id="provider" required></select>

          <label for="model">Model</label>
          <select id="model" required></select>

          <label for="prompt">Prompt</label>
          <textarea id="prompt" rows="4" placeholder="描述你想生成的视频..." required></textarea>

          <div class="row">
            <div>
              <label for="duration_sec">时长(秒)</label>
              <input id="duration_sec" type="number" min="1" max="20" value="4" />
            </div>
            <div>
              <label for="fps">FPS</label>
              <input id="fps" type="number" min="8" max="60" value="24" />
            </div>
          </div>

          <label for="resolution">分辨率</label>
          <select id="resolution">
            <option value="854x480">854x480 (默认)</option>
            <option value="1024x576">1024x576</option>
            <option value="1280x720">1280x720</option>
          </select>

          <details>
            <summary>高级设置（可选）</summary>
            <label for="base_url">Base URL</label>
            <input id="base_url" type="text" placeholder="https://api.example.com" />

            <label for="public_base_url">Public Base URL (ComfyUI)</label>
            <input
              id="public_base_url"
              type="text"
              placeholder="http://192.168.x.x:8188（用于返回可访问视频链接）"
            />

            <label for="api_path">API Path</label>
            <input id="api_path" type="text" placeholder="/v1/video/generations" />

            <label for="model_override">Model Override</label>
            <input id="model_override" type="text" placeholder="自定义模型名" />

            <label for="workflow">Workflow JSON (ComfyUI)</label>
            <textarea
              id="workflow"
              rows="6"
              placeholder='{"6":{"inputs":{"text":"..."},"class_type":"CLIPTextEncode"}}'
            ></textarea>

            <div class="row">
              <div>
                <label for="prompt_node_id">Prompt Node ID</label>
                <input id="prompt_node_id" type="text" value="6" />
              </div>
              <div>
                <label for="prompt_input_key">Prompt Input Key</label>
                <input id="prompt_input_key" type="text" value="text" />
              </div>
            </div>

            <div class="row">
              <div>
                <label for="timeout_sec">Timeout (s)</label>
                <input id="timeout_sec" type="number" min="10" value="900" />
              </div>
              <div>
                <label for="poll_interval_sec">Poll Interval (s)</label>
                <input id="poll_interval_sec" type="number" min="0.2" step="0.2" value="2" />
              </div>
            </div>

            <label for="api_key">API Key</label>
            <input id="api_key" type="password" placeholder="可留空使用服务端环境变量" />

            <label for="gateway_token">Gateway Bearer Token</label>
            <input id="gateway_token" type="password" placeholder="仅在服务端开启鉴权时需要" />

            <label for="extra_body">Extra Body (JSON)</label>
            <textarea id="extra_body" rows="3" placeholder='{"foo":"bar"}'></textarea>
          </details>

          <button id="submit-button" type="submit">提交生成</button>
        </form>
        <p class="hint" id="form-hint"></p>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>任务队列</h2>
          <button id="refresh-button" type="button">刷新</button>
        </div>
        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
