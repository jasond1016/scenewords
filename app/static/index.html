<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Video Gateway</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Video Gateway</h1>
        <p>iPad 端统一调用本地与第三方视频模型</p>
      </header>

      <section class="card">
        <h2>生成任务</h2>
        <form id="generate-form">
          <label for="gateway_token">Gateway Bearer Token</label>
          <input id="gateway_token" type="password" placeholder="仅在服务端开启鉴权时需要" />

          <div class="row">
            <div>
              <label for="provider">Provider</label>
              <select id="provider" required></select>
            </div>
            <div>
              <label for="model">Model</label>
              <select id="model" required></select>
            </div>
          </div>

          <div id="operation-row" hidden>
            <label for="operation">Operation</label>
            <select id="operation"></select>
          </div>

          <div id="dynamic-fields" class="dynamic-fields"></div>

          <button id="submit-button" type="submit">提交生成</button>
        </form>
        <p class="hint" id="form-hint"></p>
      </section>

      <section class="card player-card">
        <div class="section-header">
          <h2>播放器</h2>
          <button id="play-latest-button" type="button">播放最新完成</button>
        </div>
        <div class="player-shell">
          <video id="main-player" controls playsinline preload="metadata"></video>
        </div>
        <div class="player-controls">
          <button id="player-switch-button" type="button" hidden>切换到新结果</button>
          <a
            id="player-open-link"
            class="button-link is-disabled"
            href="#"
            target="_blank"
            rel="noreferrer noopener"
            aria-disabled="true"
            >在新窗口打开</a
          >
        </div>
        <p class="player-meta" id="player-meta">请选择任务开始播放</p>
        <p class="hint" id="player-hint"></p>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>任务队列</h2>
          <button id="refresh-button" type="button">刷新</button>
        </div>
        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
